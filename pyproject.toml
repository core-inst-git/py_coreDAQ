[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py_coreDAQ"
version = "1.1.3"
description = "Python driver for the coreDAQ low-noise opto-electronic data acquisition system."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Core Instrumentation", email = "hello@coreinstrumentation.com" },
]
keywords = ["optical power meter", "photonics", "coreDAQ", "instrumentation", "DAQ"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Physics",
  "Typing :: Typed",
]
dependencies = [
  "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.urls]
Homepage = "https://coreinstrumentation.com"
Repository = "https://github.com/coreinstrumentation/py_coreDAQ"
"Bug Tracker" = "https://github.com/coreinstrumentation/py_coreDAQ/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["py_coreDAQ*"]

[tool.setuptools.package-data]
py_coreDAQ = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
