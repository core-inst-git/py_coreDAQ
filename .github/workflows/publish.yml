name: Test and Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  # -----------------------------------------------------------------------
  # Run the test suite on every push and PR.
  # -----------------------------------------------------------------------
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v

  # -----------------------------------------------------------------------
  # Build the sdist and wheel.
  # Only runs on a published GitHub Release.
  # -----------------------------------------------------------------------
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'release'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # -----------------------------------------------------------------------
  # Publish to PyPI using OIDC trusted publishing — no API token needed.
  #
  # One-time PyPI setup (per repo):
  #   pypi.org → Your project → Publishing → Add a new publisher
  #     Owner:       <your-github-org-or-username>
  #     Repository:  py_coreDAQ
  #     Workflow:    publish.yml
  #     Environment: pypi            ← must match the environment: field below
  #
  # Then create the matching GitHub Environment:
  #   GitHub repo → Settings → Environments → New environment → name it "pypi"
  #   Add a protection rule: "Required reviewers" if you want manual approval.
  # -----------------------------------------------------------------------
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release'

    environment:
      name: pypi                          # change this if you name the environment differently
      url: https://pypi.org/p/py_coreDAQ

    permissions:
      id-token: write                     # required for OIDC trusted publishing

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
