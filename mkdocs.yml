site_name: coreDAQ
site_description: Python driver for the coreDAQ low-noise opto-electronic data acquisition system
site_url: https://py-coredaq.readthedocs.io/
repo_url: https://github.com/core-inst-git/py_coreDAQ
repo_name: GitHub
docs_dir: docs

theme:
  name: material
  features:
    - content.action.edit
    - navigation.footer

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/core-inst-git/py_coreDAQ
      name: GitHub
    - icon: fontawesome/brands/github
      link: https://github.com/core-inst-git/py_coreDAQ/issues/new
      name: Report an issue

edit_uri: https://github.com/core-inst-git/py_coreDAQ/issues/new?labels=docs&title=Docs+feedback%3A+

nav:
  - Home: index.md
  - Installation: installation.md
  - Quickstart: quickstart.md
  - Read Power: readings.md
  - Capture Data: capture.md
  - Ranges and AutoRange: ranges.md
  - Units, Sample Rate, and Oversampling: settings.md
  - Frames, Masking, and Memory Limits: frames.md
  - Zeroing and Signal Health: zeroing.md
  - Device State: state.md
  - API Reference: api-reference.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: false
      pygments_lang_class: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
