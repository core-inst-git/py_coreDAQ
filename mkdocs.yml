site_name: coreDAQ
site_description: Python driver for the coreDAQ low-noise opto-electronic data acquisition system
site_url: https://py-coredaq.readthedocs.io/
repo_url: https://github.com/core-inst-git/py_coreDAQ
repo_name: GitHub
docs_dir: docs

theme:
  name: material
  features:
    - content.action.edit
    - navigation.footer
    - navigation.sections
    - navigation.top

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/core-inst-git/py_coreDAQ
      name: GitHub
    - icon: fontawesome/brands/github
      link: https://github.com/core-inst-git/py_coreDAQ/issues/new
      name: Report an issue

edit_uri: https://github.com/core-inst-git/py_coreDAQ/issues/new?labels=docs&title=Docs+feedback%3A+

nav:
  - Getting Started:
    - Overview: index.md
    - Installation: installation.md
    - Quickstart: quickstart.md
    - Connections & Back Panel: connections.md
  - Measuring:
    - Reading Power: readings.md
    - Units, Sample Rate & Bandwidth: settings.md
    - Ranges & AutoRange: ranges.md
    - Zeroing & Signal Health: zeroing.md
    - Wavelength & Responsivity: wavelength.md
  - Capturing Data:
    - Capture: capture.md
    - External Trigger: trigger.md
    - Frames & Memory: frames.md
  - coreDAQ Mk2:
    - Mk2 & Ethernet: mk2.md
    - Performance Tiers & Licensing: tiers.md
    - Multi-unit Sync (coreLINK): sync.md
    - Sensors & Diagnostics: sensors.md
    - Firmware Updates: firmware.md
  - Reference:
    - Device State: state.md
    - API Reference: api-reference.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: false
      pygments_lang_class: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
